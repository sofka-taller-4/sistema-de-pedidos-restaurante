server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy API requests to api-gateway
  location /api/ {
    proxy_pass http://api-gateway:3000/api/;
    
    # ✅ H    
    # ✅ Headers necesarios
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # ✅ Cookie handling - pasar cookies de ida y vuelta
    proxy_set_header Cookie $http_cookie;
    proxy_pass_request_headers on;
    
    # ✅ Configuración de cookies en respuesta
    proxy_cookie_path / /;
    proxy_cookie_domain ~^(.*)$ "$host";
    
    # ✅ Timeouts
    proxy_connect_timeout 30s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    
    # ✅ Buffering
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
  }

  # 🆕 WebSocket proxy con upgrade headers
  location /api/ws {
    proxy_pass http://api-gateway:3000/api/ws;
    
    # ✅ WebSocket upgrade
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    
    # ✅ Headers necesarios
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # ✅ Cookies para WebSocket
    proxy_set_header Cookie $http_cookie;
    proxy_cookie_path / /;
    proxy_cookie_domain ~^(.*)$ "$host";
    
    # ✅ Timeouts más largo para conexiones WebSocket
    proxy_read_timeout 86400;
    proxy_send_timeout 86400;
    proxy_connect_timeout 30s;
