# pytest configuration for orders-producer-python
[tool:pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --verbose
    --color=yes
    --cov=app
    --cov-report=xml:coverage.xml
    --cov-report=term-missing
    --cov-report=html
    --cov-branch

[coverage:run]
source = app/
branch = True
relative_files = True
omit = 
    */test_*.py
    */__pycache__/*
    */venv/*
    */env/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:xml]
output = coverage.xml

[coverage:html]
directory = htmlcov
