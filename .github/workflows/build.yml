name: Build
on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'hotfix/**'
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      
      # ===== API Gateway =====
      - name: Set up Node.js for api-gateway
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies and run tests for api-gateway
        run: |
          cd api-gateway
          npm install
          npm run test:coverage
        continue-on-error: true
      
      # ===== Orders Producer Frontend =====
      - name: Set up Node.js for orders-producer-frontend
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies and run tests for orders-producer-frontend
        run: |
          cd orders-producer-frontend
          npm install
          npm run test:coverage
        continue-on-error: true
      
      # ===== Orders Producer Node =====
      - name: Set up Node.js for orders-producer-node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies and run tests for orders-producer-node
        run: |
          cd orders-producer-node
          npm install
          npm run test:coverage
        continue-on-error: true
      
      # ===== Orders Producer Python =====
      - name: Set up Python for orders-producer-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies and run tests for orders-producer-python
        run: |
          cd orders-producer-python
          pip install -r requirements.txt
          pytest --cov=app --cov-report=xml:coverage.xml --cov-report=html
        continue-on-error: true
      
      # ===== Coverage Verification =====
      - name: Check coverage reports
        run: |
          echo "Checking coverage reports..."
          ls -la orders-producer-frontend/coverage/lcov.info || echo "⚠️ Frontend coverage not found"
          ls -la api-gateway/coverage/lcov.info || echo "⚠️ API Gateway coverage not found"
          ls -la orders-producer-node/coverage/lcov.info || echo "⚠️ Orders Node coverage not found"
          ls -la orders-producer-python/coverage.xml || echo "⚠️ Python coverage not found"
          echo "Coverage check completed"
      
      # ===== SonarQube Scan =====
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true
