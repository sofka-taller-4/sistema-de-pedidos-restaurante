name: Build & SonarQube

# Este workflow se ejecuta DESPUÉS de que main.yml termine exitosamente
on:
  workflow_run:
    workflows: ["CI - Tests & Coverage"]
    types:
      - completed
    branches:
      - develop
  
  # También se ejecuta en push directo a main (sin PR)
  push:
    branches:
      - main

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    # Solo ejecutar si el workflow anterior fue exitoso (para PRs)
    # O siempre ejecutar para push a main
    if: |
      github.event_name == 'push' ||
      github.event.workflow_run.conclusion == 'success'
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Análisis completo para SonarQube
          # Si viene de workflow_run, hacer checkout del branch correcto
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}
      
      # ===== API Gateway =====
      - name: 🟢 Setup Node.js for api-gateway
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: 📦 Install dependencies and run tests for api-gateway
        run: |
          cd api-gateway
          npm install
          npm run test:coverage
        continue-on-error: true
      
      # ===== Orders Producer Frontend =====
      - name: 🟢 Setup Node.js for orders-producer-frontend
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: 📦 Install dependencies and run tests for orders-producer-frontend
        run: |
          cd orders-producer-frontend
          npm install
          npm run test:coverage
        continue-on-error: true
      
      # ===== Orders Producer Node =====
      - name: 🟢 Setup Node.js for orders-producer-node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: 📦 Install dependencies and run tests for orders-producer-node
        run: |
          cd orders-producer-node
          npm install
          npm run test:coverage
        continue-on-error: true
      
      # ===== Admin Service =====
      - name: 🟢 Setup Node.js for admin-service
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: 📦 Install dependencies and run tests for admin-service
        run: |
          cd admin-service
          npm install
          npm run test:coverage
        continue-on-error: true
      
      # ===== Orders Producer Python =====
      - name: 🐍 Setup Python for orders-producer-python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: 📦 Install dependencies and run tests for orders-producer-python
        run: |
          cd orders-producer-python
          pip install -r requirements.txt
          pip install pytest-cov
          pytest --cov=app --cov-report=xml:coverage.xml --cov-report=html
        continue-on-error: true
      
      # ===== Coverage Verification =====
      - name: 📊 Check coverage reports
        run: |
          echo "================================================"
          echo "Verificando reportes de cobertura para SonarQube"
          echo "================================================"
          
          echo "📋 Frontend:"
          ls -lh orders-producer-frontend/coverage/lcov.info 2>/dev/null && echo "✅ Encontrado" || echo "⚠️  No encontrado"
          
          echo "📋 API Gateway:"
          ls -lh api-gateway/coverage/lcov.info 2>/dev/null && echo "✅ Encontrado" || echo "⚠️  No encontrado"
          
          echo "📋 Orders Node:"
          ls -lh orders-producer-node/coverage/lcov.info 2>/dev/null && echo "✅ Encontrado" || echo "⚠️  No encontrado"
          
          echo "📋 Admin Service:"
          ls -lh admin-service/coverage/lcov.info 2>/dev/null && echo "✅ Encontrado" || echo "⚠️  No encontrado"
          
          echo "📋 Python:"
          ls -lh orders-producer-python/coverage.xml 2>/dev/null && echo "✅ Encontrado" || echo "⚠️  No encontrado"
          
          echo "================================================"
          echo "Verificación completada - Iniciando SonarQube scan"
          echo "================================================"
      
      # ===== SonarQube Scan =====
      - name: 🔍 SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true
      
      - name: ✅ Build Complete
        run: |
          echo "================================================"
          echo "✅ ANÁLISIS DE SONARQUBE COMPLETADO"
          echo "================================================"
          echo ""
          echo "🔍 SonarQube scan ejecutado"
          echo "📊 Reportes de cobertura procesados"
          echo "🎯 Revisión de calidad de código disponible"
          echo ""
          echo "================================================"