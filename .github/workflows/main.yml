name: CI - Tests & Coverage

on:
  pull_request:
    branches:
      - develop

jobs:
  # Job para servicios Node.js/TypeScript
  test-node-services:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: true # Detiene todos los jobs si uno falla
      matrix:
        service:
          - api-gateway
          - admin-service
          - orders-producer-node
          - orders-producer-frontend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.service }}/package-lock.json
      
      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: npm ci
      
      - name: Run tests with coverage
        working-directory: ${{ matrix.service }}
        run: npm run test:coverage
      
      - name: Check coverage threshold
        working-directory: ${{ matrix.service }}
        run: |
          echo "Verificando cobertura mínima del 60%..."
          # Extrae el porcentaje de cobertura del output de Jest
          COVERAGE=$(npm run test:coverage 2>&1 | grep -oP 'All files\s+\|\s+\K[\d.]+' | head -1)
          
          if [ -z "$COVERAGE" ]; then
            echo "❌ No se pudo obtener el porcentaje de cobertura"
            exit 1
          fi
          
          echo "📊 Cobertura actual: ${COVERAGE}%"
          
          # Compara con el umbral mínimo
          if (( $(echo "$COVERAGE < 60" | bc -l) )); then
            echo "❌ La cobertura ${COVERAGE}% es menor al 60% requerido"
            exit 1
          fi
          
          echo "✅ Cobertura OK: ${COVERAGE}% >= 60%"
      
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}
          path: ${{ matrix.service }}/coverage/
          retention-days: 7

  # Job para servicio Python
  test-python-service:
    name: Test orders-producer-python
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: orders-producer-python/requirements.txt
      
      - name: Install dependencies
        working-directory: orders-producer-python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov # Asegurar que pytest-cov está instalado
      
      - name: Run tests with coverage
        working-directory: orders-producer-python
        run: |
          pytest --cov=app \
                 --cov-report=term-missing \
                 --cov-report=html \
                 --cov-fail-under=60 \
                 --cov-report=xml:coverage.xml
                 -v
      
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-orders-producer-python
          path: orders-producer-python/htmlcov/
          retention-days: 7

  # Job final que depende de todos los anteriores
  ci-success:
    name: ✅ All Tests Passed
    runs-on: ubuntu-latest
    needs: [test-node-services, test-python-service]
    if: success()
    
    steps:
      - name: Success message
        run: |
          echo "🎉 Todos los tests pasaron exitosamente"
          echo "✅ Cobertura mínima del 60% alcanzada en todos los servicios"
          echo "🚀 El PR está listo para revisión"
