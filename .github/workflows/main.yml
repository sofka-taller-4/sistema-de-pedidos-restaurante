name: CI - Tests, Coverage & SonarQube

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'hotfix/**'
      - 'refactor/**'
      - 'prueba4'
      
  pull_request:
    branches:
      - develop
      - main  
env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'
  MIN_COVERAGE: 60

jobs:
  # =====================================================
  # FASE 1: TESTS Y COBERTURA
  # =====================================================
  
  test-node-services:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: true
      matrix:
        service:
          - api-gateway
          - admin-service
          - orders-producer-node
          - orders-producer-frontend
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ matrix.service }}/package-lock.json
      
      - name: 📦 Install dependencies
        working-directory: ${{ matrix.service }}
        run: npm ci
      
      - name: 🧪 Run tests with coverage
        working-directory: ${{ matrix.service }}
        run: npm run test:coverage
        env:
          NODE_ENV: test
      
      - name: 📊 Check coverage threshold
        working-directory: ${{ matrix.service }}
        run: |
          echo "Verificando cobertura para ${{ matrix.service }}"
          if [ -f coverage/coverage-summary.json ]; then
            COVERAGE=$(cat coverage/coverage-summary.json | python3 -c "import sys, json; print(json.load(sys.stdin)['total']['lines']['pct'])" 2>/dev/null || echo "0")
            echo "Cobertura: ${COVERAGE}%"
            
            if awk -v cov="$COVERAGE" -v min="${{ env.MIN_COVERAGE }}" 'BEGIN { exit (cov < min) ? 0 : 1 }'; then
              echo "❌ Cobertura ${COVERAGE}% < ${{ env.MIN_COVERAGE }}%"
              exit 1
            fi
            echo "✅ Cobertura OK"
          fi
      
      - name: 📤 Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}
          path: ${{ matrix.service }}/coverage/
          retention-days: 7

  test-python-service:
    name: Test orders-producer-python
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: orders-producer-python/requirements.txt
      
      - name: 📦 Install dependencies
        working-directory: orders-producer-python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov
      
      - name: 🧪 Run tests with coverage
        working-directory: orders-producer-python
        run: |
          pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=html \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=${{ env.MIN_COVERAGE }} \
            -v
      
      - name: 📤 Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-orders-producer-python
          path: |
            orders-producer-python/htmlcov/
            orders-producer-python/coverage.xml
          retention-days: 7

  # =====================================================
  # FASE 2: SONARQUBE (solo si tests pasan)
  # =====================================================
  
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: [test-node-services, test-python-service]
    if: success()
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      # Descargar todos los reportes de cobertura
      - name: 📥 Download coverage reports
        uses: actions/download-artifact@v4
        with:
          path: coverage-reports
      
      # Reorganizar coverage reports
      - name: 📁 Organize coverage files
        run: |
          mkdir -p api-gateway/coverage
          mkdir -p admin-service/coverage
          mkdir -p orders-producer-node/coverage
          mkdir -p orders-producer-frontend/coverage
          mkdir -p orders-producer-python
          
          # Copiar reportes a sus ubicaciones
          cp -r coverage-reports/coverage-api-gateway/* api-gateway/coverage/ 2>/dev/null || true
          cp -r coverage-reports/coverage-admin-service/* admin-service/coverage/ 2>/dev/null || true
          cp -r coverage-reports/coverage-orders-producer-node/* orders-producer-node/coverage/ 2>/dev/null || true
          cp -r coverage-reports/coverage-orders-producer-frontend/* orders-producer-frontend/coverage/ 2>/dev/null || true
          cp -r coverage-reports/coverage-orders-producer-python/* orders-producer-python/ 2>/dev/null || true
          
          # Verificar que existen
          echo "Verificando reportes de cobertura:"
          ls -lh api-gateway/coverage/lcov.info 2>/dev/null && echo "✅ API Gateway" || echo "⚠️  API Gateway"
          ls -lh admin-service/coverage/lcov.info 2>/dev/null && echo "✅ Admin Service" || echo "⚠️  Admin Service"
          ls -lh orders-producer-node/coverage/lcov.info 2>/dev/null && echo "✅ Orders Node" || echo "⚠️  Orders Node"
          ls -lh orders-producer-frontend/coverage/lcov.info 2>/dev/null && echo "✅ Frontend" || echo "⚠️  Frontend"
          ls -lh orders-producer-python/coverage.xml 2>/dev/null && echo "✅ Python" || echo "⚠️  Python"
      
      - name: 🔍 SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true
      
      - name: ✅ Complete
        run: |
          echo "================================================"
          echo "✅ CI COMPLETO"
          echo "================================================"
          echo "✅ Tests pasaron"
          echo "✅ Cobertura >= 60%"
          echo "✅ SonarQube ejecutado"
          echo "================================================"