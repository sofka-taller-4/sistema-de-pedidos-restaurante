# SonarQube Configuration for Sistema de Pedidos Restaurante
# Multi-module project with JavaScript/TypeScript (Node.js + React) and Python services

sonar.projectKey=sofka-taller-4_sistema-de-pedidos-restaurante
sonar.organization=osp1n4

sonar.projectName=sistema-de-pedidos-restaurante
sonar.projectVersion=1.0

# ===== SOURCE CODE PATHS =====
sonar.sources=api-gateway/src,orders-producer-node/src,orders-producer-python/app,orders-producer-frontend/src

# ===== TEST PATHS =====
sonar.tests=api-gateway/tests,orders-producer-node/src/__tests__,orders-producer-frontend/src/test

# ===== COVERAGE PATHS - JAVASCRIPT/TYPESCRIPT (LCOV format) =====
sonar.javascript.lcov.reportPaths=api-gateway/coverage/lcov.info,orders-producer-node/coverage/lcov.info,orders-producer-frontend/coverage/lcov.info

# ===== COVERAGE PATHS - PYTHON (Cobertura XML format) =====
sonar.python.coverage.reportPaths=orders-producer-python/coverage.xml

# ===== EXCLUSIONS =====
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.spec.ts,**/*.test.ts,**/*.test.tsx,**/test-utils/**,**/scripts/**

# ===== TEST INCLUSIONS =====
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.test.tsx,**/test_*.py

# ===== COVERAGE EXCLUSIONS =====
sonar.coverage.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.spec.ts,**/*.test.ts,**/*.test.tsx,**/test-utils/**,**/scripts/**

# ===== ENCODING =====
sonar.sourceEncoding=UTF-8

# ===== PYTHON VERSION =====
sonar.python.version=3.9,3.10,3.11
