# SonarQube Configuration for Sistema de Pedidos Restaurante
# This is a multi-module project with JavaScript/TypeScript and Python services

sonar.projectKey=sistema-pedidos-restaurante
sonar.projectName=Sistema de Pedidos Restaurante
sonar.projectVersion=1.0

# Source code paths (relative to this file)
sonar.sources=api-gateway/src,orders-producer-node/src,orders-producer-python/app,orders-producer-frontend/src

# Test files paths
sonar.tests=api-gateway/tests,orders-producer-node/src/__tests__,orders-producer-frontend/src/test

# Exclusions (node_modules, build outputs, coverage reports, etc.)
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.spec.ts,**/*.test.ts,**/*.test.tsx,**/test-utils/**,**/scripts/**

# Test file patterns
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.test.tsx,**/test_*.py

# ==============================================
# JavaScript/TypeScript Coverage Configuration
# ==============================================
# LCOV format for all JS/TS services (Frontend, API Gateway, orders-producer-node)
sonar.javascript.lcov.reportPaths=orders-producer-frontend/coverage/lcov.info,api-gateway/coverage/lcov.info,orders-producer-node/coverage/lcov.info

# ==============================================
# Python Coverage Configuration
# ==============================================
# Cobertura XML format for Python service
sonar.python.coverage.reportPaths=orders-producer-python/coverage.xml

# Source encoding
sonar.sourceEncoding=UTF-8

# Language-specific settings
sonar.language=js,ts,py

# Additional Python settings
sonar.python.version=3.9,3.10,3.11
