      - run
      - deploy
      - 'orders-producer-node'
      - '--image=${_AR_HOSTNAME}/${_AR_PROJECT_ID}/${_AR_REPOSITORY}/orders-producer-node:$SHORT_SHA'
      - '--region=${_DEPLOY_REGION}'
